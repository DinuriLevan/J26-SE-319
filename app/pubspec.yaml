name: akurin
description: "AkuRin — shared foundation shell for the dyslexia literacy learning app."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0

  # On-device cache
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0

  # Connectivity (for the offline sync queue)
  connectivity_plus: ^6.1.0

  # Local profile id
  uuid: ^4.5.1

  # Spelling & Phonics: spoken prompts (device TTS), sound effects and
  # recorded Sinhala audio, and the Sinhala word pictures (SVG)
  flutter_tts: ^4.2.5
  audioplayers: ^6.8.1
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.21.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/icon_foreground.png

flutter:
  uses-material-design: true

  assets:
    - assets/avatars/
    - assets/branding/
    - assets/spelling/
    - assets/spelling/model/
    - assets/spelling/sinhala/
    - assets/spelling/sinhala/images/
    - assets/spelling/sinhala/audio/
    - assets/spelling/sinhala/audio/prompts/
    - assets/spelling/sinhala/audio/tiles/

  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-VariableFont_wght.ttf
    - family: NotoSansSinhala
      fonts:
        - asset: assets/fonts/NotoSansSinhala-VariableFont_wdth,wght.ttf
