# Speech assessment settings. Values marked PLACEHOLDER are chosen on DEV data in a later stage.

audio:
  sample_rate: 16000
  max_duration_s: 6.0
  trim_top_db: 30          # librosa.effects.trim threshold; PLACEHOLDER

embedding:
  model_name: facebook/wav2vec2-xls-r-300m
  layer: 9                 # chosen by the Stage 2 layer sweep on DEV speakers (eval/results/layer_sweep_dev.md)
  truncate_encoder: true   # verified bit-identical (eval/results/truncation_check.json)

baseline:
  # Stage 1 single-reference baseline. null = first adult reference (by speaker_id).
  reference_speaker: null

service:
  max_upload_bytes: 2000000   # ~6 s of 16-bit 48 kHz stereo WAV is ~1.2 MB

corpus:
  # Children's sentence recordings (ethics approval confirmed 2026-10-15). Split is by speaker:
  # test speakers are never used to choose layer, k, n or thresholds (src/splits.py enforces it).
  test_speakers: [g3_s5, g4_s3]

scoring:
  mode: bank               # bank = multi-reference + learned range (Stage 3); single = Stage 1 baseline
  k_nearest: 3             # aggregate = mean of the k nearest reference DTW costs
  n_std: 2.0               # accept if aggregate <= mean + n_std * std (leave-one-out over the bank)
  min_refs_for_bank_threshold: 4
  loo_unit: speaker        # leave out the whole speaker (approved 2026-10-15; spec value was token)
  fallback_threshold: 0.245 # dev-best single-reference threshold (eval/results/bank_study_dev.md); used when < 4 refs

localisation:
  max_flagged_units: 2

retry:
  max_tries_per_step: 3

paths:
  data_dir: data
  words_csv: config/words.csv   
  reference_dir: data/reference
  embeddings_dir: data/embeddings
